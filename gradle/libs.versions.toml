[versions]
sonarqube = '7.5.0.8588'
jacocolog = '4.0.2'
spotbugs = '6.5.11'
ben-manes-versions = '0.61.0'
git-semver = '1.21.3'
openrewrite = '7.41.0'
rewrite-testing-frameworks = '3.44.0'

jspecify = '1.0.1'
junit = '6.1.3'
assertj = '4.0.0-M1'
slf4j = '2.1.0-alpha1'
logback = '1.6.3'

[plugins]
sonarqube = { id = 'org.sonarqube', version.ref = 'sonarqube' }
jacocolog = { id = 'org.barfuin.gradle.jacocolog', version.ref = 'jacocolog' }
spotbugs = { id = 'com.github.spotbugs', version.ref = 'spotbugs' }
ben-manes-versions = { id = 'io.github.ben-manes.versions', version.ref = 'ben-manes-versions' }
git-semver = { id = 'pl.allegro.tech.build.axion-release', version.ref = 'git-semver' }
openrewrite = { id = 'org.openrewrite.rewrite', version.ref = 'openrewrite' }

[libraries]
rewrite-testing-frameworks = { module = 'org.openrewrite.recipe:rewrite-testing-frameworks', version.ref = 'rewrite-testing-frameworks' }

jspecify = { module = 'org.jspecify:jspecify', version.ref = 'jspecify' }

junit = { module = 'org.junit:junit-bom', version.ref = 'junit' }
junit-jupiter = { module = 'org.junit.jupiter:junit-jupiter' }
junit-jupiter-api = { module = 'org.junit.jupiter:junit-jupiter-api' }
junit-jupiter-engine = { module = 'org.junit.jupiter:junit-jupiter-engine' }
junit-platform-launcher = { module = 'org.junit.platform:junit-platform-launcher' }
assertj = { module = 'org.assertj:assertj-core', version.ref = 'assertj' }

slf4j = { module = 'org.slf4j:slf4j-api', version.ref = 'slf4j' }
logback = { module = 'ch.qos.logback:logback-classic', version.ref = 'logback' }

[bundles]
test-implementation = ['junit-jupiter-api', 'assertj']
test-compile = ['junit-jupiter', 'junit-jupiter-engine']
test-runtime = ['junit-jupiter-engine', 'junit-platform-launcher']